<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Cartero Invisible</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="script.js"></script>
</head>

<body>

  <header>
    <h1 id="titolPrincipal">El Cartero Invisible</h1>
  </header>

  <main>
    <button id="btnSaluda">Saluda'm!</button>

    <div style="max-width: 800px; margin: 0 auto;">

      <div id="buzon">📮</div>

          <h2 class="info">Benvingut al teu buzón virtual</h2>

    <form id="formCarta">

          <input type="text" id="remitent" placeholder="El teu nom" required>
          
          <input type="text" id="destinatari" placeholder="A qui va dirigida?" required>
          
          <textarea id="contingut" placeholder="Escriu la teva carta..." required></textarea>
          
          <input type="text" id="personatge" placeholder="A quin personatge escrius? (ex: Einstein)">
        
          <button type="submit">Enviar carta</button>

  </form>

      <div id="contenidorCartes">

        
        <div class="carta">
          <h3>De: Maria</h3>
          <p>Hola, com estàs? T'escric des del passat.</p>
        </div>

      </div>

      <section id="llistatCartes">
      <!-- de moment buit: aquí aniran les cartes -->
      </section>

       <button id="btnAfegir">Afegir carta</button>

      <section id="formulariCarta">
        <!-- de moment buit: aquí anirà el formulari -->
      </section>

      <section id="registreCartes">
        <button id="btnMostrarTaula">Mostrar taula</button>

        <table id="taulaCartes" style="display: none;  margin-top: 15px; width: 100%; ">
            <thead>
              <tr>
                <th>ID</th>
                <th>Remitente</th>
                <th>Destinatario</th>
                <th>Contenido</th>
                <th>Eliminar</th>
                <th>Editar</th>
              </tr>
            </thead>
  <tbody id="cosTaula">
    <!-- Las filas se renderizan dinámicamente aquí -->
  </tbody>
  <div id="modalEditar" style="display: none;">
  <div class="modal-contenido">
    <span id="btnCerrarModal">&times;</span>
    <h2>Editar Carta</h2>
    
    <form id="formEditarCarta">
      <!-- Campo oculto para almacenar el ID -->
      <input type="hidden" id="editId">

      <label for="editRemitent">Remitente:</label>
      <input type="text" id="editRemitent" required>

      <label for="editDestinatari">Destinatario:</label>
      <input type="text" id="editDestinatari" required>

      <label for="editContingut">Contenido:</label>
      <textarea id="editContingut" required></textarea>

      <div class="acciones-modal">
        <button type="submit" id="btnGuardarModal">Guardar Cambios</button>
        <button type="button" id="btnCancelarModal">Cancelar</button>
      </div>
    </form>
  </div>
</div>
</table>
      </section>
      
    </div>
    
    <dialog id="modalEdicio">
  <form id="formEdicio">
    <input type="hidden" id="inputIdCarta">
    
    <label>Remitent:</label>
    <input type="text" id="inputRemitent">

    <label>Destinatari:</label>
    <input type="text" id="inputDestinatari">

    <label>Personatge:</label>
    <input type="text" id="inputPersonatge">

    <label>Contingut:</label>
    <textarea id="inputContingut"></textarea>

    <button type="submit">Desar canvis</button>
  </form>
</dialog>
   

  </main>
 
  
  <footer>
    <marquee>¡Bienvenido al Cartero Invisible!</marquee>  
    
  </footer>

</body>

</html>
